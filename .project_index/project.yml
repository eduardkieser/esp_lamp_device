summary: Arduino firmware for ESP32-C3 lamps with local dimming, battery telemetry, optional networking, and production QC control.
description: This is the established C++ firmware for the smart-lamp controller. It supports production-local control, remote-control and data-logging variants, calibrated battery monitoring, PWM dimming, Wi-Fi provisioning, and a QC build that connects to the phone-hosted Lamp QC controller. The newer Rust firmware now carries the active production direction, while this implementation remains the hardware-behavior reference.
